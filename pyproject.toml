[project]
name = "studyagent"
version = "0.1.0"
description = "Agente de estudos: daemon local com API em socket Unix, tarefas, propostas e eventos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studyagent = "studyagent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
